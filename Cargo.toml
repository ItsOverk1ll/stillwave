[workspace]
resolver = "2"
members = [
    "crates/stillwave-core",
    "crates/stillwave-db",
    "crates/stillwave-audio",
    "crates/stillwave-plugins",
    "apps/stillwave/src-tauri",
]

exclude = ["plugin-sdk"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ItsOverk1ll/stillwave"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
