[package]
name = "stillwave-db"
description = "SQLite schema, migrations, queries and search for Stillwave"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
stillwave-core = { path = "../stillwave-core" }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
tempfile = "3"

[[bench]]
name = "search"
harness = false

[lints]
workspace = true

[[bench]]
name = "library"
harness = false
