name: Release

# Pushing a tag like v0.1.0 builds everything and attaches it to a DRAFT release.
# Nothing is published until a maintainer reviews and publishes the draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: stillwave-*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f)
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Stillwave ${{ github.ref_name }}" \
            --notes "Pre-alpha build. See the README for status and known limits." \
            "${files[@]}"
