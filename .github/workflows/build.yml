name: Build

# Produces downloadable installers for every platform. Also called by release.yml.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (NSIS and MSI)
            os: windows-latest
            bundles: nsis,msi
            artifact: windows-x64
          - name: Linux x64 (deb, rpm, AppImage)
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            artifact: linux-x64
          # Native arm64 runner (free for public repositories), so no cross-compiling.
          # Raspberry Pi OS (64-bit) installs this .deb.
          - name: Linux arm64 (deb, for Raspberry Pi OS)
            os: ubuntu-24.04-arm
            bundles: deb
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/stillwave/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/stillwave/pnpm-lock.yaml
      - name: Build installers
        working-directory: apps/stillwave
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: stillwave-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  android:
    name: Android (debug-signed APK, arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # The runner image already has the Android SDK; install the NDK we pin.
      - name: Install NDK
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/stillwave/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/stillwave/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: apps/stillwave
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: stillwave-android-arm64-debug
          if-no-files-found: error
          path: apps/stillwave/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    # SPIKE (see docs/ios-unsigned-builds.md). Produces an UNSIGNED .ipa that
    # SideStore re-signs with the user's own Apple ID. Not yet proven in CI, so
    # a failure here does not fail the workflow; read the job log.
    name: iPhone (unsigned ipa)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/stillwave/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/stillwave/pnpm-lock.yaml
      - name: Build unsigned ipa
        run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stillwave-ios-unsigned
          if-no-files-found: error
          path: dist/Stillwave-unsigned.ipa
