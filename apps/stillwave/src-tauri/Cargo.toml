[package]
name = "stillwave"
description = "Stillwave: your music, your files, bit-perfect."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix is needed on Windows so the lib and bin names do not clash
# (https://github.com/rust-lang/cargo/issues/8519).
name = "stillwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stillwave-core = { path = "../../../crates/stillwave-core" }
stillwave-db = { path = "../../../crates/stillwave-db" }

# Not `[lints] workspace = true`: Tauri's mobile entry macro generates code the
# workspace `unsafe_code = "forbid"` would reject.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
